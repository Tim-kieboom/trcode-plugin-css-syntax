id = "css-syntax"
name = "CSS"
version = "0.0.1"
abi = "1.12"
# A language and nothing else: no module of its own and no pane. The grammar is the file the
# installer downloads and checks.

[language]
name = "CSS"
grammar = "css.wasm"
extensions = ["css"]
# The query is the grammar's own (queries/highlights.scm of https://github.com/tree-sitter/tree-sitter-css, v0.25.0 (dda5cfc)),
# with the capture names the theme has (`tag` is `keyword`), and its patterns in the opposite order
# of the grammar's file: TerminalCode takes the first of two patterns on the same text, and that
# file is written for the last (as Neovim and Zed take it).
highlights = '''
[
  "{"
  ")"
  "("
  "}"
] @punctuation.bracket

[
  "#"
  ","
  "."
  ":"
  "::"
  ";"
] @punctuation.delimiter

(unit) @type

(float_value) @number

(integer_value) @number

(color_value) @string.special

(string_value) @string

(important) @keyword

(from) @keyword

(to) @keyword

(at_keyword) @keyword

"@keyframes" @keyword

"@supports" @keyword

"@namespace" @keyword

"@charset" @keyword

"@import" @keyword

"@media" @keyword

(function_name) @function

(attribute_name) @attribute

(pseudo_class_selector (class_name) @attribute)

(pseudo_element_selector (tag_name) @attribute)

(feature_name) @property

(property_name) @property

(namespace_name) @namespace

(id_name) @type

(class_name) @type

((plain_value) @variable
 (#match? @variable "^--"))

((property_name) @variable
 (#match? @variable "^--"))

(attribute_selector (plain_value) @string)

"only" @operator

"not" @operator

"or" @operator

"and" @operator

"*=" @operator

"$=" @operator

"~=" @operator

"|=" @operator

"^=" @operator

"=" @operator

"/" @operator

"*" @operator

"-" @operator

"+" @operator

">" @operator

"~" @operator

(universal_selector) @type

(nesting_selector) @type

(tag_name) @type

(comment) @comment
'''
